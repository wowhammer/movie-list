   - 실제 화면폭보다 레이아웃폭이 크게 벌어지면(=깨짐) 감지해서 재적용
   - 앱 복귀(visibilitychange)·초반 몇 초 반복 감시까지 커버 */
(function(){
  try{
    var VP='width=device-width, initial-scale=1, minimum-scale=1';
    function reapply(){
      try{
        var head=document.head||document.getElementsByTagName('head')[0]; if(!head) return;
        var old=document.querySelector('meta[name="viewport"]'); if(old&&old.parentNode) old.parentNode.removeChild(old);
        var m=document.createElement('meta'); m.name='viewport'; m.setAttribute('content', VP+', maximum-scale=1');
        head.appendChild(m);
        void document.documentElement.offsetWidth;                 /* 강제 리플로우 */
        setTimeout(function(){ try{ m.setAttribute('content', VP); void document.documentElement.offsetWidth; }catch(e){} }, 30);
      }catch(e){}
    }
    function broken(){                                             /* 레이아웃폭이 실기기폭보다 크게 벌어졌나 */
      try{ var cw=document.documentElement.clientWidth||0;
        var sw=(window.screen&&screen.width)?screen.width:(window.innerWidth||cw);
        var touchWide=(("ontouchstart" in window)||(navigator.maxTouchPoints||0)>0) && cw>860;
        return (sw>0 && cw > sw*1.4) || touchWide; }catch(e){ return false; }
    }
    function guard(){ if(broken()) reapply(); }
    reapply();                                                     /* 파싱 중 즉시 1회 */
    var n=0, iv=setInterval(function(){ guard(); if(++n>=12){ clearInterval(iv); } }, 300);  /* ~3.6초 감시 */
    if(document.readyState==='loading') document.addEventListener('DOMContentLoaded', guard);
    window.addEventListener('load', guard);
    window.addEventListener('pageshow', function(e){ if(e&&e.persisted) reapply(); else guard(); });
    window.addEventListener('resize', guard);
    window.addEventListener('orientationchange', function(){ setTimeout(reapply, 150); });
    document.addEventListener('visibilitychange', function(){ if(!document.hidden){ setTimeout(guard, 50); setTimeout(guard, 400); } });
  }catch(e){}
})();
</script>

.bnav{position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:50;width:100%;max-width:600px;display:flex;background:var(--card,#fff);border-top:1px solid var(--line,#e5e5e5);padding:8px 4px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 20px rgba(0,0,0,.08)}
.bnav-i{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:none;color:var(--ink-soft,#9a9a9a);font-size:10.5px;font-weight:600;padding:4px 0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.bnav-i *{pointer-events:none}
.bnav-i.on{color:#E0483F}
dialog.nd-hasnav .dbody, dialog.nd-hasnav .wscroll, dialog.nd-hasnav .nsRes{ padding-bottom:calc(74px + env(safe-area-inset-bottom)) !important; }
/* v464 #2: 섹션(통계·설정·인사이트)도 검색처럼 전체화면 = 떠 있는 '새창'이 아니라 메인 프레임 페이지처럼 */
dialog.nd-hasnav{ width:100vw !important; max-width:100vw !important; height:100vh !important; height:100dvh !important; max-height:100dvh !important; margin:0 !important; border-radius:0 !important; display:flex !important; flex-direction:column !important; }
/* v485: 섹션 다이얼로그 = 고정헤더 + 스크롤바디. block+overflow:hidden이라 wscroll이 콘텐츠대로 늘어나 스크롤 불가였던 것 수정(인사이트·AI글쓰기) */
dialog.nd-hasnav>.nd-sectop, dialog.nd-hasnav>.nd-sechd{ flex:0 0 auto !important; }
dialog.nd-hasnav>.wscroll, dialog.nd-hasnav>.dbody, dialog.nd-hasnav>.nsRes{ flex:1 1 auto !important; min-height:0 !important; overflow-y:auto !important; }
dialog.nd-hasnav .wscroll{ max-height:none !important; }
/* v487: 닫힌 섹션 다이얼로그가 display:flex로 화면에 남던 회귀(겹침·잔상·홈/전단계 먹통) 수정. 닫히면 감춘다. */
dialog.nd-hasnav:not([open]){ display:none !important; }
/* v468 섹션 상단 = 홈 프레임과 픽셀 동일(가운데 정렬·좌우 12px, 로고 왼쪽 14px) */
.nd-sectop{ width:min(100%,520px); margin:0 auto; padding:calc(14px + env(safe-area-inset-top)) 12px 0 !important; }
.nd-sectop .ndh-top{ padding:2px 2px 10px; }
/* v468 섹션 공통 헤더 — 제목 위치·폰트·닫기 통일 */
.nd-sechd{ display:flex; align-items:center; justify-content:space-between; gap:10px; width:min(100%,520px); margin:0 auto; padding:2px 12px 12px; }
.nd-sechd h3{ margin:0; font-size:21px; font-weight:800; letter-spacing:-.02em; color:var(--ink,#f6eddf); }
.nd-sechd-x{ width:37px; height:37px; flex:0 0 auto; border-radius:50%; border:1px solid var(--line,rgba(238,224,205,.18)); background:none; color:var(--ink-soft,#c6b9a6); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; -webkit-tap-highlight-color:transparent; }
/* v471 하위 메뉴 헤더 — '← 인사이트' 뒤로 버튼(어디로 가는지 명확) + 제목 */
.nd-sechd.nd-sub{ justify-content:flex-start; gap:12px; }
.nd-secback{ flex:0 0 auto; background:none; border:1px solid var(--line,rgba(238,224,205,.18)); border-radius:999px; color:var(--ink-soft,#c6b9a6); font-size:13.5px; font-weight:700; padding:7px 13px; cursor:pointer; -webkit-tap-highlight-color:transparent; white-space:nowrap; }
/* v470 하위 메뉴 내용의 중복 큰 제목(whead) 숨김 — 상단 통일 헤더가 제목 담당 */

<script>
/* =====================================================================
 *  내도감 엔진 골조 v1
 *  구조: [MANIFESTS 설정] → [DataSource 추상화] → [Engine 렌더]
 *  - 데모(Mock)로 즉시 구동. Client ID 입력 시 GoogleSheet로 무중단 교체.
 *  - 화면/엔진은 데이터 출처를 모른다(영속성·배포·테스트를 동시에 해결).
 *  실행: 브라우저로 열면 데모로 동작. 구글 연결은 http 서버(localhost)에서만 가능.
 * ===================================================================== */

/* ── 0. 안전 저장소: 배포본은 localStorage, 미리보기/샌드박스는 메모리로 자동 폴백 ── */
const store = (() => {
  const NS = (typeof CONFIG!=="undefined" && CONFIG.DEPLOY) ? "app:" : "";   // 배포앱은 개인앱과 로컬저장소 분리
  try { const k="__nd"; localStorage.setItem(k,"1"); localStorage.removeItem(k);
    return { getItem:k=>localStorage.getItem(NS+k), setItem:(k,v)=>localStorage.setItem(NS+k,String(v)), removeItem:k=>localStorage.removeItem(NS+k) }; }
  catch(e){ const m={}; return { getItem:k=>k in m?m[k]:null, setItem:(k,v)=>{m[k]=String(v);}, removeItem:k=>{delete m[k];} }; }
})();

/* =====================================================================
 *  ROADMAP (박아둠) — STEP 2: 배포용 '각자 구글 로그인' (나중에 배포할 때 구현)
 *  - 목표: 각 사용자가 자기 구글로 로그인 → 본인 드라이브에 '내도감 Data' 시트 자동 생성
 *          → 모든 수정이 그 시트에 저장(앱 지워도 데이터는 각자 드라이브에 남음).
 *  - 코드: GoogleSheetDataSource(type:"mysheet", drive.file) 골조 있음 → sourceFor에 연결 필요.
 *  - 준비물: 구글 클라우드 OAuth 클라이언트 ID 1개(+Sheets·Drive API), '구글로 로그인' 버튼.
 *  - 지금(Step1): 7개 카테고리 nd 규격 통일 완료. 탭명 한글·_id 첫열로 정리 중(앱은 옛/새 이름 자동수용).
 * ===================================================================== */
/* ── 1. MANIFESTS: 도메인 정의(여기만 늘리면 도메인이 는다) ── */
const MANIFESTS = {
  mbti:{ id:"mbti", title:"나의 성향", icon:"🧠", vol:"", canAdd:false,
    source:{ type:"sheet", tab:"성격유형" },
    fields:[ {k:"date",sheet:"측정일",label:"측정일",type:"date"},
             {k:"type",sheet:"유형",label:"유형",type:"text"},
             {k:"nick",sheet:"별칭",label:"별칭",type:"text"},
             {k:"axes",sheet:"축상세",label:"축상세",type:"text",hideForm:true} ],
    search:["type","nick"], dateSort:"date",
    stats:[ {label:"측정",type:"count",c:"#7c3aed"} ] },
  period:{ id:"period", title:"생리주기", icon:"🌙", vol:"", canAdd:false, source:{ type:"sheet", tab:"생리주기" },
    fields:[ {k:"start",sheet:"시작일",label:"시작일",type:"date"},{k:"end",sheet:"종료일",label:"종료일",type:"date"},{k:"flow",sheet:"양",label:"양",type:"text"},{k:"symptoms",sheet:"증상",label:"증상",type:"text"},{k:"mood",sheet:"기분",label:"기분",type:"text"},{k:"note",sheet:"메모",label:"메모",type:"text"} ],
    search:["flow","mood","note"], dateSort:"start",
    stats:[ {label:"기록",type:"count",c:"#e03e63"} ] },
  assets:{ id:"assets", title:"자산", icon:"💰", vol:"", canAdd:true, source:{ type:"sheet", tab:"자산" }, fields:[ {k:"name",sheet:"자산명",label:"자산명",type:"text",full:true},{k:"kind",sheet:"종류",label:"종류",type:"select",options:["","부동산","예금·적금","주식·펀드","코인","현금","자동차","기타"]},{k:"value",sheet:"평가액",label:"평가액(원)",type:"number",money:true},{k:"buyDate",sheet:"취득일",label:"취득일",type:"date"},{k:"expiry",sheet:"만기일",label:"만기일",type:"date"},{k:"place",sheet:"보관처",label:"보관처·계좌",type:"text"},{k:"memo",sheet:"메모",label:"메모",type:"textarea"} ], search:["name","kind","place","memo"], dateSort:"buyDate", card:{ kind:"specimen", thumb:"💰", memo:"memo", title:function(r){ return r.name||"(무제)"; }, meta:function(r){ var v=(r.value!==""&&r.value!=null&&!isNaN(Number(r.value)))?Number(r.value).toLocaleString()+"원":""; return [r.kind,v].filter(Boolean).join(" · "); } }, stats:[ {label:"자산 수",type:"count",c:"#0891b2"}, {label:"총 평가액",type:"sum",field:"value",unit:"원",c:"#c2410c"} ] },
  recipes:{ id:"recipes", title:"음식 레시피", icon:"🍳", vol:"", canAdd:true, source:{ type:"sheet", tab:"레시피" }, fields:[ {k:"title",sheet:"요리명",label:"요리명",type:"text",full:true},{k:"kind",sheet:"종류",label:"종류",type:"select",options:["","한식","중식","일식","양식","분식","베이킹","음료","기타"]},{k:"ingredients",sheet:"재료",label:"재료(쉼표로 여러 개)",type:"tags"},{k:"steps",sheet:"조리법",label:"조리법(순서대로)",type:"textarea",rows:4},{k:"time",sheet:"소요시간",label:"소요시간(분)",type:"number"},{k:"level",sheet:"난이도",label:"난이도",type:"select",options:["","쉬움","보통","어려움"]},{k:"rating",sheet:"별점",label:"별점",type:"rating"},{k:"status",sheet:"상태",label:"상태",type:"seg",options:["해봄","또할래","찜"]},{k:"memo",sheet:"메모",label:"메모·후기",type:"textarea"},{k:"cover",sheet:"사진",label:"사진",type:"image"} ], search:["title","kind","ingredients","memo"], filterBy:{ field:"kind", allLabel:"전체" }, card:{ kind:"specimen", thumb:"🍳", tags:"ingredients", memo:"memo", meta:function(r){ return [r.kind,(r.time?r.time+"분":""),r.level].filter(Boolean).join(" · "); }, flags:function(r){ return [ (r.rating!=null&&r.rating!=="")?{t:"★ "+r.rating}:null, stHas(r,"찜")?{t:"찜"}:null ]; } }, stats:[ {label:"레시피 수",type:"count",c:"#e8590c"}, {label:"찜",type:"countIf",field:"status",eq:"찜",c:"#e0a86a"} ] },
    /* 영화: 실제 구글시트(Apps Script)에서 라이브로 불러옴.
     source.map = 시트 한글 헤더 → 엔진 항목 이름.  source.derive = 특수 처리(코드·수식·숫자). */
  movies:{ id:"movies", title:"영화", icon:"🎬", vol:"卷1", canAdd:true, shareFields:["title","director","year","country"],
    source:{ type:"sheet", tab:"영화", tabAlt:"MOVIE", idCol:"원제", skipEnsure:true,
      /* nd 합류(v90): 영화도 차계부처럼 nd(구글시트) 방식으로 통일. 데이터는 MOVIE 탭 그대로.
         식별키=원제(중복·공백 없음 확인). clean: 시청여부 2자코드→watched/rewatch, 스트리밍/추천 분리. */
      clean(o){
        o._id=String(o._id==null?"":o._id); o.orig=o._id;
        if(!o.orig) return null;
        const code=String(o["시청여부"]==null?"":o["시청여부"]).trim();
        o.watched=code.charAt(0)==='W'?"O":""; o.rewatch=code.charAt(1)==='R';
        const jjim=String(o["찜"]==null?"":o["찜"]).trim().toLowerCase();
        o.pick=(jjim==='true'||jjim==='o'||jjim==='1'||jjim==='찜')?true:(code.charAt(1)==='P');
        { const _rt=(o["TMDB평점"]!=null&&o["TMDB평점"]!=="")?o["TMDB평점"]:o["평점"]; o.rating=(_rt==null||_rt==="")?null:(parseFloat(_rt)||null); }
        o.watchDate=String(o["본날"]==null?"":o["본날"]);
        o.directSearch=String(o["직접검색"]==null?"":o["직접검색"]);
        o.streaming=(typeof o.streaming==="string")?o.streaming.split(/[,\/|]+/).map(x=>x.trim()).filter(Boolean):(Array.isArray(o.streaming)?o.streaming:[]);
        o.recommendList=String(o.recommend==null?"":o.recommend).split(/[\/,]+/).map(x=>x.trim()).filter(Boolean);
        delete o["시청여부"]; delete o["찜"]; delete o["TMDB평점"]; delete o["본날"]; delete o["직접검색"];
        return o;
      } },
    search:["title","orig","director","actors"],
    activity:{ df:"watchDate", when:r=>r.watched==="O", label:"시청", name:r=>r.title },
    fields:[ {k:"title",sheet:"한국 개봉명",label:"한국 개봉명",type:"text"},
             {k:"year",sheet:"개봉연도",label:"개봉연도",type:"number"},
             {k:"director",sheet:"감독",label:"감독",type:"text"},
             {k:"actors",sheet:"배우",label:"배우",type:"text"},
             {k:"country",sheet:"국적",label:"국적",type:"text"},
             {k:"streaming",sheet:"스트리밍",label:"스트리밍",type:"checks",options:["넷플릭스","디즈니+","티빙","왓챠","웨이브","쿠팡플레이","Apple TV+","아마존 프라임","라프텔"]},
             {k:"recommend",sheet:"추천",label:"추천",type:"text"},{k:"source",sheet:"출처",label:"출처",type:"text"},
             {k:"review",sheet:"코멘트",label:"코멘트",type:"text"} ],
    stats:[ {label:"전체",type:"count",sf:""},
            {label:"시청완료",type:"countIf",field:"watched",eq:"O",sf:"watched"},
            {label:"다시볼것",type:"countIf",field:"rewatch",eq:true,sf:"rewatch"},
            {label:"찜",type:"countIf",field:"pick",eq:true,sf:"pick"} ],
    card:{ kind:"specimen", thumb:"🎞",
           meta:r=>[r.year, r.director, r.actors].filter(Boolean).join(" · "),
           tags:"streaming",
           flags:r=>[ r.rating!=null?{t:"TMDB "+r.rating,cls:"star"}:0,
                      r.watched==="O"?{t:"시청",cls:"on"}:0,
                      r.rewatch?{t:"다시볼것",cls:"on"}:0,
                      r.pick?{t:"찜",cls:"on"}:0 ] } },

  /* 차계부: 백엔드는 이미 있지만 이번 단계는 데모(샘플) 유지.
     실제 연결은 movies처럼 source.type:"appsscript", sheet:"carlog" + map/derive 한 벌만 추가하면 됨. */
  /* 차계부: 실제 구글시트(정비·지출 기록)에서 라이브로 불러옴. */
  carlog:{ id:"carlog", title:"차계부", icon:"🚗", vol:"卷2", canAdd:true,
    /* nd 공통 방식으로 통일(정식 출시 대비): 읽기도 nd 게이트 사용. 쓰기(추가·수정·삭제)는 기존 CARLOG 탭 그대로.
       기존 시트가 식별자로 'ID' 열을 써서 idCol:"ID"로 _id에 매핑. skipEnsure: 이미 있는 탭이라 건드리지 않음.
       clean: 가격/주행거리의 쉼표 등 비숫자 정리(예전 derive가 하던 일). */
    source:{ type:"sheet", tab:"차계부", tabAlt:"CARLOG", idCol:"ID", skipEnsure:true,
      clean(o){
        o.cost = parseInt(String(o.cost==null?"":o.cost).replace(/[^\d]/g,''),10) || 0;
        o.odo  = (o.odo==null||o.odo==="") ? null : (parseInt(String(o.odo).replace(/[^\d]/g,''),10) || null);
        if(!o.date && !o.car && !o.work && !o.cost && o.odo==null) return null;   // 시트의 완전 빈 줄은 버림(카드로 안 그림)
        if(o._id==null || o._id==="") o._id = "nd_"+[o.date,o.car,o.odo,o.work].join("|");   // ID 없는 옛 기록: 내용 기반 안정 id(표시·필터·클릭 되게)
        o._id = String(o._id);   // 숫자 ID가 문자 data-id와 안 맞아 상세가 안 열리던 문제 방지
        return o;
      } },
    fields:[ {k:"date",sheet:"날짜",label:"날짜",type:"date",today:true},
             {k:"car",sheet:"차량",label:"차량(싼타페/제네시스)",type:"text"},
             {k:"work",sheet:"작업내용",label:"작업내용",type:"text"},
             {k:"shop",sheet:"정비소",label:"정비소",type:"text"},
             {k:"cost",sheet:"가격",label:"가격(원)",type:"number",money:true},
             {k:"odo",sheet:"주행거리",label:"주행거리(km)",type:"number",comma:true},
             {k:"memo",sheet:"비고",label:"비고",type:"text"},
             {k:"cover",sheet:"사진",label:"차량 사진",type:"image"} ],
    filterBy:{ field:"car", allLabel:"전체" },
    search:["work","shop","car","memo"],
    activity:{ df:"date", when:r=>true, label:"정비", name:r=>[r.car,r.work].filter(Boolean).join(" ") },
    stats:[ {label:"기록",type:"count",c:"#16a34a"},
            {label:"총 정비비",type:"sum",field:"cost",unit:"원",c:"#c2410c"},
            {label:"총 주행",type:"max",field:"odo",unit:"km",c:"#0ea5e9"} ],
    card:{ kind:"data", title:r=>`${r.date}${r.car?" · "+r.car:""}`,
           kv:[{k:"작업",f:"work"},{k:"금액",f:"cost",u:"원"},{k:"주행",f:"odo",u:"km"},{k:"정비소",f:"shop"}] } },

  /* 도서: '설정 한 장'으로 추가된 새 분야. 지금은 샘플로 화면 확인.
     실제 시트 연결 준비되면 → source 를 { type:"appsscript", sheet:"book", map:{...}, derive(){...} } 로 교체만. */
  books:{ id:"books", title:"도서", icon:"📖", vol:"卷3", canAdd:true,
    source:{ type:"sheet", tab:"도서" },
    fields:[ {k:"title",sheet:"제목",label:"제목",type:"text"},
             {k:"author",sheet:"저자",label:"저자",type:"text"},
             {k:"status",sheet:"상태",label:"상태",type:"select",options:["","읽음","읽는중"]},
             {k:"rating",sheet:"평점",label:"내 평점(읽은 책만)",type:"rating"},
             {k:"review",sheet:"감상평",label:"서평/메모",type:"textarea"},
             {k:"quotes",sheet:"문구",label:"밑줄 친 문장 (읽으면서 모으기)",type:"quotes",full:true},
             {k:"pick",sheet:"찜",label:"읽고싶다(찜)",type:"bool"},
             {k:"reread",sheet:"다시",label:"다시읽을것",type:"bool"},
             {k:"owned",sheet:"소장",label:"소장",type:"bool"},
             {k:"recommend",sheet:"추천",label:"추천",type:"text"},{k:"source",sheet:"출처",label:"출처",type:"text"},
             {k:"publisher",sheet:"출판사",label:"출판사",type:"text"},
             {k:"year",sheet:"출판연도",label:"출판연도",type:"number"},

/* 구글 시트 소스: drive.file 스코프로 앱 전용 시트에 read/write. Client ID 필요. */
/* 내 구글시트: 로그인 후 내 드라이브에 '내도감 Data'를 만들고 읽고/쓴다.
   ★ 안전 규칙: 탭이 '없을 때만' 만든다. 있으면 절대 손대지 않는다. 지우거나 덮어쓰는 기능은 아예 없다. */
class GoogleSheetDataSource {
  constructor(clientId){ this.clientId=clientId; this.isLive=true; this.label="내 구글시트"; this.token=null; this.ssId=store.getItem("nd.ssId"); }
  async ensureReady(){ await this._auth(); await this._ensureSpreadsheet(); await this._ensureTabs(); return true; }
  _auth(){ return new Promise((res,rej)=>{
    if(!window.google?.accounts?.oauth2) return rej(new Error("구글 로그인 스크립트 미로드(인터넷 확인)"));
    const tc = google.accounts.oauth2.initTokenClient({
      client_id:this.clientId, scope:"https://www.googleapis.com/auth/drive.file",
      callback:r=>{ if(r.error) return rej(new Error("로그인 실패: "+r.error)); this.token=r.access_token; res(); } });
    tc.requestAccessToken();
  }); }
  async _api(url,opt={}){
    const res=await fetch(url,{...opt,headers:{Authorization:"Bearer "+this.token,"Content-Type":"application/json",...(opt.headers||{})}});
    const t=await res.text(); let b; try{b=JSON.parse(t);}catch{b=t;}
    if(!res.ok){ let h=res.status===403?" (구글 클라우드에서 Sheets·Drive 사용설정 확인)":res.status===401?" (다시 연결 필요)":"";
      const msg=(b&&b.error&&b.error.message) ? b.error.message : (typeof b==="string"?b.slice(0,200):JSON.stringify(b).slice(0,200));
      throw new Error(`HTTP ${res.status}${h} — ${msg}`); }
    return b;
  }
  _cell(v){ return Array.isArray(v)?v.join("|") : v===true?"TRUE" : v===false?"FALSE" : (v==null?"":String(v)); }
  _range(sheet, a1){ return encodeURIComponent(`'${sheet}'!${a1}`); }   // 한글 탭 이름은 따옴표로 감싼다
  async _ensureSpreadsheet(){   // 파일이 없을 때만, 저장용 탭(도서·명산·러닝)만 딱 만든다(빈 기본시트 안 생기게)
    if(this.ssId) return;
    const tabs=Object.values(MANIFESTS).filter(m=>m.source?.type==="mysheet").map(m=>({properties:{title:m.source.sheet}}));
    const d=await this._api("https://sheets.googleapis.com/v4/spreadsheets",{method:"POST",
      body:JSON.stringify({properties:{title:"내도감 Data"}, sheets:tabs})});
    this.ssId=d.spreadsheetId; store.setItem("nd.ssId",this.ssId);
  }
  async _tabTitles(){
    const d=await this._api(`https://sheets.googleapis.com/v4/spreadsheets/${this.ssId}?fields=sheets.properties.title`);
    return (d.sheets||[]).map(s=>s.properties.title);
  }
  async _isEmpty(sheet){   // 탭이 비어 있는지(헤더도 없는지) 확인
    const d=await this._api(`https://sheets.googleapis.com/v4/spreadsheets/${this.ssId}/values/${this._range(sheet,"A1")}`);
    return !(d.values && d.values.length);
  }
  async _ensureTabs(){   // 없는 탭만 만들고, '비어 있을 때만' 헤더·샘플을 채운다. 기존 데이터는 절대 안 덮음.
    const have=await this._tabTitles();
    this.warnings=[];
    for(const m of Object.values(MANIFESTS)){
      if(m.source?.type!=="mysheet") continue;
      const tab=m.source.sheet;                                      // ★ 탭 이름은 설정(source) 안에 있다
      try{
        if(!have.includes(tab)){                                     // 없으면 탭 생성
          await this._api(`https://sheets.googleapis.com/v4/spreadsheets/${this.ssId}:batchUpdate`,{method:"POST",
            body:JSON.stringify({requests:[{addSheet:{properties:{title:tab}}}]})});
        }
        if(await this._isEmpty(tab)){                                // ★ 비어 있을 때만 채움(부분실패 복구 포함)
          const keys=["_id",...fieldKeys(m)];
          const seed=(SAMPLE[m.id]||[]).map(r=>keys.map(k=>this._cell(r[k])));
          await this._write(tab, [keys, ...seed]);
        }
      }catch(e){ this.warnings.push(`${m.title}: ${e.message}`); }   // 한 탭이 실패해도 연결은 계속
    }
  }
  async _write(sheet,values){
    return this._api(`https://sheets.googleapis.com/v4/spreadsheets/${this.ssId}/values/${this._range(sheet,"A1")}?valueInputOption=RAW`,
      {method:"PUT",body:JSON.stringify({values})});
  }
  async list(id){
    const m=MANIFESTS[id];
    const d=await this._api(`https://sheets.googleapis.com/v4/spreadsheets/${this.ssId}/values/${this._range(m.source.sheet,"A1:Z10000")}`);
    const vals=d.values||[]; if(vals.length<2) return [];
    const [head,...rows]=vals;
    return rows.map(r=>Object.fromEntries(head.map((k,i)=>[k, coerce(r[i])])));
  }
  async upsert(id,row){   // 맨 아래에 한 줄만 추가(append). 기존 줄은 절대 안 건드림.
    const m=MANIFESTS[id]; const keys=["_id",...fieldKeys(m)];
    const line=keys.map(k=>this._cell(row[k]));
    return this._api(`https://sheets.googleapis.com/v4/spreadsheets/${this.ssId}/values/${this._range(m.source.sheet,"A1")}:append?valueInputOption=RAW`,
      {method:"POST",body:JSON.stringify({values:[line]})});
  }
}
/* Apps Script 통로: 기존 백엔드(doGet)를 그대로 재사용. 이번 단계는 읽기(list) 전용. */
function reCell(s){ // 네이버 링크 수식이 껴 있으면 글자만 뽑고, 아니면 그대로 정리
  return String(s==null?'':s).replace(/=HYPERLINK\("[^"]*",\s*"([^"]+)"\)/,'$1').trim();
}
function mapRow(m, row){ // 시트 한 줄(한글 헤더) → 엔진 항목
  const out = {};
  const map = m.source?.map || {};
  for(const [key, header] of Object.entries(map)) out[key] = reCell(row[header]);
  if(typeof m.source?.derive === "function") m.source.derive(out, row, reCell);
  if(!out._id) out._id = crypto.randomUUID();
  return out;
}
class AppsScriptDataSource {
  constructor(url){ this.url=url; this.isLive=true; this.label="구글시트"; }
  async ensureReady(){ if(!this.url) throw new Error("APPS_SCRIPT_URL이 비어 있습니다"); return true; }
  async list(id){
    const m=MANIFESTS[id];
    const q=m.source?.sheet ? ("?sheet="+encodeURIComponent(m.source.sheet)) : "";
    const res=await fetch(this.url+q);
    if(!res.ok) throw new Error("HTTP "+res.status+" (Apps Script 배포/권한 확인)");
    const raw=await res.json();
    return (Array.isArray(raw)?raw:[]).map(row=>mapRow(m,row));
  }
  async post(payload){   // 기존 영화·차계부 백엔드 액션 호출(예: 시청여부 업데이트)
    const res=await fetch(this.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(payload)});
    const t=await res.text(); let j; try{ j=JSON.parse(t); }catch(e){ j={}; }
    if(j && j.ok===false) throw new Error(j.error||"실패");
    if(j && j.error) throw new Error(j.error);
    return j;
  }
  async upsert(){ throw new Error("이 단계는 보기 전용입니다(추가·수정은 다음 단계)"); }
}

/* SheetDataSource: 기존 시트에 '탭'을 만들고 읽고 쓰는 통로 (방금 뚫은 nd 문 사용).
   도서·명산·러닝처럼 우리가 관리하는 탭에 씀. 영화·차계부는 위 AppsScriptDataSource(기존 방식) 유지. */
function sheetCell(v){ return Array.isArray(v)?v.join("|") : v===true?"TRUE" : v===false?"FALSE" : (v==null?"":String(v)); }
class SheetDataSource {
  constructor(url){ this.url=url; this.isLive=true; this.label="구글시트"; this._ensured=new Set(); this._tab={}; this._idkey={}; }
  async ensureReady(){ if(!this.url) throw new Error("APPS_SCRIPT_URL이 비어 있습니다"); return true; }
  _flatten(m, r){ const o={_id:sheetCell(r._id)}; (m.fields||[]).forEach(f=>{ o[f.sheet||f.k]=sheetCell(r[f.k]); }); return o; }
  async _post(payload){   // 탭 만들기·한 줄 추가 같은 '쓰기'. text/plain로 보내야 브라우저가 안 막음.
    const res=await fetch(this.url,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},
      body:JSON.stringify(Object.assign({nd:1},payload))});
    const t=await res.text(); let j; try{ j=JSON.parse(t); }catch(e){ j={}; }
    if(j && j.error) throw new Error(j.error);
    return j;
  }
  async ensure(m){        // 탭이 없으면 만들고(+샘플), 있으면 그대로. 한 세션에 한 번만.
    if(m.source && m.source.skipEnsure) return;   // 이미 있는 기존 탭(차계부 등)은 건드리지 않음
    if(this._ensured.has(m.id)) return;
    const header=ndHeaders(m);
    await this._post({action:"ensureTab", tab:m.source.tab, header, rows:[]});   // 샘플 안 심음: 실데이터만(한글 헤더)
    this._ensured.add(m.id);
  }
  async list(id){
    const m=MANIFESTS[id];
    await this.ensure(m);
    // 탭 이름 자동 감지: 새 이름(예: 영화/차계부)과 옛 이름(MOVIE/CARLOG) 둘 다 수용
    const cands = this._tab[id]
      ? [this._tab[id], m.source.tab, m.source.tabAlt].filter((v,i,a)=>v&&a.indexOf(v)===i)
      : [m.source.tab, m.source.tabAlt].filter(Boolean);
    let raw=[], used=cands[0]||m.source.tab, got=false;
    for(const t of cands){
      const res=await fetch(this.url+"?nd=1&action=read&tab="+encodeURIComponent(t));
      if(!res.ok) continue;
      const j=await res.json();
      if(j && j.error) throw new Error(j.error);
      const arr=Array.isArray(j)?j:[];
      if(arr.length){ raw=arr; used=t; got=true; break; }
      if(!got){ raw=arr; used=t; }
    }
    this._tab[id]=used;
    const hdr = raw[0] ? Object.keys(raw[0]) : [];
    this._idkey[id] = hdr.includes("_id") ? "_id" : ((m.source.idCol && hdr.includes(m.source.idCol)) ? m.source.idCol : "_id");
    const inv=ndInv(m); const clean=m.source&&m.source.clean;
    return raw.map(row=>{ const o={}; for(const kh in row){ const ek=inv[ndNorm(kh)]||kh; const val=coerce(row[kh]);
      if(o[ek]===undefined || o[ek]===null || o[ek]==="") o[ek]=val;   // 중복 열: 첫 비어있지않은 값 우선
    } var _oo=clean?clean(o):o; return _oo; }).filter(Boolean);
  }
  async readTab(tab){ const res=await fetch(this.url+"?nd=1&action=read&tab="+encodeURIComponent(tab)); if(!res.ok) return []; let j; try{ j=await res.json(); }catch(e){ return []; } if(j&&j.error) return []; return Array.isArray(j)?j:[]; }
  tabOf(id){ return this._tab[id] || (MANIFESTS[id] && MANIFESTS[id].source.tab); }
  idkeyOf(id){ return this._idkey[id] || (MANIFESTS[id] && MANIFESTS[id].source.idCol) || "_id"; }
  async upsert(id,row){   // 탭 맨 아래에 한 줄 추가(저장)
    const m=MANIFESTS[id];
    return this._post({action:"append", tab:m.source.tab, header:ndHeaders(m), row:this._flatten(m,row)});
  }
  async update(id,rowId,row){   // _id로 찾아 수정
    const m=MANIFESTS[id];
    return this._post({action:"update", tab:m.source.tab, id:rowId, row:this._flatten(m,row)});
  }
  async remove(id,rowId){       // _id로 찾아 삭제
    const m=MANIFESTS[id];
    return this._post({action:"delete", tab:m.source.tab, id:rowId});
  }

const CALCS = { // 확장점: 새 계산식은 여기 등록
  deltaOdoPerLiter(rows, field){ let prev=null; return rows.map(r=>{ let v=null;
    if(r.type==="주유"&&r.liters){ if(prev!=null) v=+((r.odo-prev)/r.liters).toFixed(1); prev=r.odo; }
    return {...r,[field]:v}; }); },
  pacePerKm(rows, field){ return rows.map(r=>({ ...r, [field]: (r.dist? +(r.time/r.dist).toFixed(1): null) })); },
  subMonthly(rows, field){ return rows.map(r=>{ const c=+r.cost||0; return {...r,[field]: r.cycle==="연"?Math.round(c/12):c }; }); },   // 연구독은 12로 나눠 월 환산
  subYearly(rows, field){ return rows.map(r=>{ const c=+r.cost||0; return {...r,[field]: r.cycle==="연"?c:c*12 }; }); }              // 월구독은 12배 연 환산
};
function applyComputed(m, rows){
  if(m&&m.id==="cellar"&&Array.isArray(rows)){ rows.forEach(function(r){ if(r){ if(r.status==="마심") r.status="마셔봄"; if(r.status==="위시") r.status="찜"; } }); }
  if(m&&m.id==="albums"&&Array.isArray(rows)){ rows.forEach(function(r){ if(r&&r.genre!=null) r.genre=String(r.genre).replace(/^\s*\d+위\s*·\s*/,""); }); }
  if(!m.computed) return rows;
  let out=rows;
  for(const [field,spec] of Object.entries(m.computed)){
    const fn=CALCS[spec.calc]; if(fn) out=fn(out, field);
  }
  return out;
}
function calcStat(s, rows){
  try{
    if(s.type==="count") return rows.length;
    if(s.type==="countIf") return rows.filter(r=>{ var v=r[s.field]; return v===s.eq || (typeof v==="string" && v.split(",").map(function(x){return x.trim();}).indexOf(s.eq)>=0); }).length;
    if(s.type==="sum") return rows.filter(r=>!s.where||Object.entries(s.where).every(([k,v])=>r[k]===v)).reduce((a,r)=>a+(+r[s.field]||0),0);
    if(s.type==="max") return rows.reduce((mx,r)=>Math.max(mx,(+r[s.field]||0)),0);
    if(s.type==="avgComputed"){ const v=rows.map(r=>r[s.field]).filter(x=>x!=null); return v.length?+(v.reduce((a,b)=>a+b,0)/v.length).toFixed(1):0; }
  }catch(e){ console.error("stat",e); return "—"; } return "—";
}

function expandCustomManifest(spec){

    if(Array.isArray(f.options)&&f.options.length) o.options=[""].concat(f.options.filter(Boolean));
    if(f.type==="number"&&f.money) o.money=true;
    if(f.type==="textarea"||f.type==="image") o.full=true;
    return o;
  });
  const titleF = fields.find(f=>f.isTitle) || fields.find(f=>f.type==="text") || fields[0] || null;
  const textKeys = fields.filter(f=>["text","textarea","tags"].includes(f.type)).map(f=>f.k);
  const kv = fields.filter(f=> f!==titleF && !["image","textarea"].includes(f.type))
                   .slice(0,6).map(f=>({k:f.label, f:f.k, ...(f.money?{u:"원"}:{})}));
  const titleOf = r=>{ let v = titleF ? r[titleF.k] : null;
    if(v==null||v===""){ for(const f of fields){ if(r[f.k]!=null && r[f.k]!==""){ v=r[f.k]; break; } } }
    return (v==null||v==="") ? "(제목 없음)" : String(v); };
  const dateF = fields.find(f=>f.type==="date");
  const man = {
    id: spec.id, title: spec.title||spec.id, icon: spec.icon||"🗂", vol:"", canAdd:true, custom:true,
    source:{ type:"sheet", tab: spec.tab || spec.title || spec.id },
    fields,
    search: textKeys.length?textKeys:(fields[0]?[fields[0].k]:[]),
    stats: (function(){ var _st=[{label:"전체", type:"count"}]; var _mf=fields.find(function(f){return f.money;}); if(_mf) _st.push({label:"합계", type:"sum", field:_mf.k, unit:"원", c:"#c2410c"}); return _st; })(),
    card:{ kind:"data", title: titleOf, kv }
  };
  if(dateF){ man.activity={ df:dateF.k, when:r=>true, label:spec.title||spec.id, name:titleOf }; man.dateSort=dateF.k; }
  return man;
}

async function fetchBookInfo(title, author){
  const key=(title||"")+"|"+(author||"");
  if(bookInfoCache[key]!==undefined) return bookInfoCache[key];
  try{
    const kk=CONFIG.GOOGLE_BOOKS_KEY?("&key="+CONFIG.GOOGLE_BOOKS_KEY):"";
    const q=encodeURIComponent((title||"")+(author?(" "+author):""));
    const d=await fetch(`https://www.googleapis.com/books/v1/volumes?maxResults=5&country=KR&q=${q}${kk}`).then(r=>r.json());
    const norm=x=>String(x||"").toLowerCase().replace(/[\s·:,\-–—()\[\]'"!?、。]/g,"");
    const qt=norm(title);
    let v=null;                                        // 제목이 실제로 맞는 결과만 채택(엉뚱한 표지 방지)
    for(const it of (d.items||[])){ const vi=it.volumeInfo||{}; const t=norm((vi.title||"")+(vi.subtitle||""));
      if(qt && t && (t.includes(qt) || qt.includes(t))){ v=vi; break; } }
    if(v){ const desc=String(v.description||"").replace(/<[^>]+>/g,"").trim();
      const cover=String((v.imageLinks&&v.imageLinks.thumbnail)||"").replace(/^http:/,"https:");
      bookInfoCache[key]={ desc, cover:cover||null, pages:v.pageCount||null, publisher:v.publisher||"", rating:(v.averageRating!=null?+v.averageRating:null), ratingsCount:(v.ratingsCount||0) };
    } else { bookInfoCache[key]={ desc:"", cover:null, pages:null, publisher:"", rating:null, ratingsCount:0 }; }   // 못 맞추면 표지 안 씀
  }catch(e){ bookInfoCache[key]=null; }
  return bookInfoCache[key];
}

async function fetchMtnInfo(name){   // 위키백과 MediaWiki API: 대표사진 + 좌표(요약API엔 좌표가 없어서 교체)

/* ── 영화 리치 상세: 포스터·줄거리·평점·리뷰 + TMDB/왓챠/네이버 + 인물 클릭 ── */
let movieInfoCache={}, personCache={};
async function fetchMovieInfo(orig, kor, year){
  const key=(orig||kor)+"|"+(year||"");
  if(movieInfoCache[key]!==undefined) return movieInfoCache[key];
  try{
    const q=encodeURIComponent(orig||kor);
    const u=`${CONFIG.TMDB_BASE}/search/movie?api_key=${CONFIG.TMDB_KEY}&language=ko-KR&query=${q}${year?`&year=${year}`:""}`;
    const d=await fetch(u).then(r=>r.json()); const m=(d.results||[])[0];
    movieInfoCache[key]= m
      ? { poster:m.poster_path?("https://image.tmdb.org/t/p/w342"+m.poster_path):null, overview:m.overview||"줄거리 정보 없음", rating:m.vote_average?m.vote_average.toFixed(1):"-", tmdbId:m.id }
      : { poster:null, overview:"정보 없음", rating:"-", tmdbId:null };
  }catch(e){ movieInfoCache[key]={ poster:null, overview:"불러오기 실패", rating:"-", tmdbId:null }; }
  return movieInfoCache[key];
}
let _ratingFillRunning=false;
async function autofillMovieRatings(){
  if(typeof CONFIG==="undefined" || !CONFIG.DEPLOY || _ratingFillRunning) return;
  const arr=CACHE.movies; if(!arr||!arr.length) return;
  const miss=r=>(r.rating==null||r.rating==="")&&(r.tmdbRating==null||r.tmdbRating==="")&&(r.title||r.orig);
  const todo=arr.filter(miss).slice(0,60); if(!todo.length) return;
  _ratingFillRunning=true; const done=[];
  try{
    for(const r of todo){
      try{ const info=await fetchMovieInfo(r.orig||r.title, r.title, r.year);
        if(info && info.rating && info.rating!=="-"){ r.tmdbRating=info.rating; done.push({_id:r._id, tmdbRating:r.tmdbRating}); } }catch(e){}
      await new Promise(res=>setTimeout(res,250));
    }
    if(done.length){ try{ savePersist("movies",arr); }catch(e){}
      try{ const S=sheetSrc(); if(S.fillRatings) await S.fillRatings("movies", done); }catch(e){}
      try{ if(state.domain==="movies") paintDomain(MANIFESTS.movies); }catch(e){} }
  }finally{ _ratingFillRunning=false; }
  if(arr.filter(miss).length) setTimeout(autofillMovieRatings,600);
}

async function fetchPerson(name){
  if(personCache[name]) return personCache[name];
  try{
    let d=await fetch(`${CONFIG.TMDB_BASE}/search/person?api_key=${CONFIG.TMDB_KEY}&language=ko-KR&query=${encodeURIComponent(name)}`).then(r=>r.json());
    if(!d.results||!d.results.length) d=await fetch(`${CONFIG.TMDB_BASE}/search/person?api_key=${CONFIG.TMDB_KEY}&query=${encodeURIComponent(name)}`).then(r=>r.json());
    if(!d.results||!d.results.length) return personCache[name]={found:false};
    const p=d.results[0];
    const c=await fetch(`${CONFIG.TMDB_BASE}/person/${p.id}/movie_credits?api_key=${CONFIG.TMDB_KEY}&language=ko-KR`).then(r=>r.json());
    const cast=(c.cast||[]).filter(x=>x.poster_path||x.release_date).sort((a,b)=>(b.popularity||0)-(a.popularity||0)).slice(0,12);
    const crew=(c.crew||[]).filter(x=>x.job==="Director"&&(x.poster_path||x.release_date)).sort((a,b)=>(b.popularity||0)-(a.popularity||0)).slice(0,12);
    return personCache[name]={ found:true, name:p.name, photo:p.profile_path?("https://image.tmdb.org/t/p/w185"+p.profile_path):null,
      dept:p.known_for_department==="Directing"?"감독":p.known_for_department==="Acting"?"배우":"영화인", cast, crew };
  }catch(e){ return personCache[name]={found:false}; }
}

function _isoOf(raw){ const pd=parseDate(String(raw)); if(!pd) return null; return pd.getFullYear()+"-"+String(pd.getMonth()+1).padStart(2,"0")+"-"+String(pd.getDate()).padStart(2,"0"); }
function buildDayLog(dateStr){
  const lines=[];
  getActive().forEach(id=>{ if(id==="diary"||id==="subs"||id==="travel") return;
    const m=MANIFESTS[id]; if(!m) return; const act=m.activity; if(!act||!act.df) return;
    const logf = DIARY_LOG[id] || (m.custom ? (r=>`- ${m.title}: ${(m.card&&m.card.title)?m.card.title(r):(r._id||"")}`) : null);
    if(!logf) return;
    (CACHE[id]||loadPersist(id)||[]).forEach(r=>{ const raw=r[act.df]; if(!raw) return;
      if(_isoOf(raw)!==dateStr) return; if(act.when && !act.when(r)) return;
      try{ lines.push(logf(r)); }catch(e){} });
  });
  if(getActive().includes("subs")){ const day=parseInt(dateStr.slice(8,10),10);
    (CACHE.subs||loadPersist("subs")||[]).forEach(r=>{ if(r.status!=="구독중") return;
      const pm=String(r.payday||"").match(/(\d{1,2})/); if(pm && parseInt(pm[1],10)===day){
        lines.push(`- ${r.name} 결제일${r.cost?` (${Number(r.cost).toLocaleString()}원)`:""}`); } });
  }
  if(getActive().includes("cards")){ const day=parseInt(dateStr.slice(8,10),10);
    (CACHE.cards||loadPersist("cards")||[]).forEach(r=>{ const pm=String(r.payday||"").match(/(\d{1,2})/); if(pm && parseInt(pm[1],10)===day) lines.push("- "+(r.name||r.issuer||"카드")+" 결제일"); });
  }
  if(getActive().includes("insurance")){ const day=parseInt(dateStr.slice(8,10),10);
    (CACHE.insurance||loadPersist("insurance")||[]).forEach(r=>{ const pm=String(r.payday||"").match(/(\d{1,2})/); if(pm && parseInt(pm[1],10)===day) lines.push("- "+(r.name||r.issuer||"보험")+" 납부일"); });
  }
  if(getActive().includes("travel")){                 // 여행: 기간(시작~종료일) 전체 날짜에 표시
    (CACHE.travel||loadPersist("travel")||[]).forEach(r=>{ if(r.status!=="다녀옴") return;
      const s=_isoOf(r.startDate), e=_isoOf(r.endDate)||s; if(!s) return;
      if(dateStr>=s && dateStr<=e){ try{ lines.push(DIARY_LOG.travel(r)); }catch(_){} } });
  }
  if(getActive().includes("books") && dateStr===todayStr()){
    (CACHE.books||loadPersist("books")||[]).forEach(r=>{ if(r.status==="읽는중" && r.title) lines.push("- 읽는중 "+r.title); });
  }
  return lines;
}
async function fillDiaryLog(d, silent){

  await Promise.all(getActive().filter(id=>id!=="diary"&&!(CACHE[id]||loadPersist(id))).map(id=>{
    try{ return sourceFor(MANIFESTS[id]).list(id).then(r=>{CACHE[id]=r;savePersist(id,r);}).catch(()=>{}); }catch(e){ return Promise.resolve(); } }));
  const lines=buildDayLog(dateStr);

  const cur=contEl.value||""; const add=lines.filter(l=>cur.indexOf(l)<0);

function _ndCalcPace(distStr,timeStr){
  var d=parseFloat(distStr), t=parseFloat(timeStr);
  if(!(d>0)||!(t>0)) return "";
  var tm=Math.floor(t+1e-9), ts=Math.round((t-tm)*100); if(ts>59) ts=59;   // 분.초 해석

}

async function saveRecord(m, row, existing){
  if(m.id==="movies" && !CONFIG.DEPLOY){                       // 영화 정보수정: MOVIE 탭, 원제 기준(전체 행 재작성)
    const base=(CACHE.movies||[]).find(x=>String(x._id)===String((existing&&existing._id)||row._id)) || existing || {};
    const merged=Object.assign({}, base, row);
    merged.recommendList=String(merged.recommend==null?"":merged.recommend).split(/[\/,]+/).map(x=>x.trim()).filter(Boolean);
    return sheetSrc().updateRaw(sheetSrc().tabOf("movies"), (existing&&existing.orig)||merged.orig||merged._id, movieKorRow(merged), "원제");
  }
  if(m.id==="carlog" && !CONFIG.DEPLOY){                        // 차계부: 차계부/CARLOG 탭, _id 또는 ID 자동감지
    const S=sheetSrc(), tab=S.tabOf("carlog"), idk=S.idkeyOf("carlog");
    const kor={};
    (m.fields||[]).forEach(f=>{ kor[f.sheet] = (row[f.k]==null?"":row[f.k]); });
    if(existing) return S.updateRaw(tab, existing._id, kor, idk);
    kor[idk]=String(Date.now());
    return S.appendRaw(tab, kor);
  }
  if(existing) return sheetSrc().update(state.domain, row._id, row);   // 도서·명산·러닝
  try{ ndGA("record_add",{cat:(m&&m.id)||state.domain}); }catch(e){}
  return sheetSrc().upsert(state.domain, row);
}
function toggleCardFlag(m,r,key,btn){
  const prev=!!r[key]; r[key]=!prev;
  const it=(CACHE.cards||[]).find(x=>String(x._id)===String(r._id)); if(it) it[key]=r[key];
  const paint=b=>{ const on=!!r[key]; btn.className="btn "+(on?"":"ghost"); btn.textContent=key==="owned"?(on?"✓ 소유":"소유"):(on?"★ 찜":"찜"); };
  paint(); paintDomain(m);
  saveRecord(m, r, r).then(()=>savePersist("cards",CACHE.cards||[])).catch(e=>{ r[key]=prev; if(it) it[key]=prev; paint(); paintDomain(m); alert("저장 실패: "+e.message); });
}
async function deleteRecord(m, r){
  if(!confirm(`'${r.title||r.date||r._id}' 삭제할까요? 되돌릴 수 없어요.`)) return;
  try{
    if(m.id==="carlog"){ const S=sheetSrc(); await S.deleteRaw(S.tabOf("carlog"), r._id, S.idkeyOf("carlog")); }
    else if(m.id==="movies") await sheetSrc().deleteRaw(sheetSrc().tabOf("movies"), r.orig||r._id, "원제");
    else await sheetSrc().remove(state.domain, r._id);
    unmarkPending(m.id, r._id);   // 삭제한 줄은 보호 해제(되살아나지 않게)
    const _c=CACHE[m.id]; if(_c){ const _n=_c.filter(x=>String(x._id)!==String(r._id)); CACHE[m.id]=_n; savePersist(m.id,_n); }
    $("#detail").close(); refreshDomain();
  }catch(e){ alert("삭제 실패: "+e.message); }
}

function paintDomain(m){   // state.rows를 화면에 그림 (데이터 다시 안 받고 재렌더 가능)
  const pk=$("#picker"); pk.style.alignItems=""; pk.style.overflow=""; pk.style.justifyContent="";     // 공유 UI 초기화
  $("#stats").className="stats"; $("#stats").style.display=""; $("#scope").style.flexDirection=""; $("#scope").style.overflow=""; $("#scope").style.justifyContent=""; $("#scope").classList.remove("scopetabs"); $("#count").classList.remove("countrow"); $("#count").style.display="";

  if(m.id==="carlog"){ paintCarlog(m); return; }

  renderPicker(m);
  applySearchUI(m);

  if(m.filterBy && state.pick) base = base.filter(r=>{ const v=r[m.filterBy.field]; const _a=Array.isArray(v)?v.map(x=>String(x).trim()):String(v||"").split(",").map(x=>x.trim()); return _a.includes(state.pick); });

  if(m.id==="mountains") renderMtnRegions(m);
  if(m.scopeSort) renderScopeSort(m);
  if(m.id==="diary") renderDiaryTags(m); if(NDTAGCATS[m.id]) renderCatTags(m); ndInjectRecChip(m);
  if(m.id==="travel" && diaryView==="map"){ $("#count").style.display="none"; renderTravelMap(m, base); _mountViewToggle(m); return; }
  if(hasCal(m) && diaryView==="cal"){ $("#count").style.display="none"; renderDiaryCalendar(m, base); _mountViewToggle(m); return; }
  let listBase = applyStatFilter(m, base); if(NDTAGCATS[m.id] && ndCatTag) listBase = listBase.filter(function(r){ return ndTagVals(r,NDTAGCATS[m.id]).indexOf(ndCatTag)>=0; });
  if(m.id==="books" && bookGenreFilter) listBase = listBase.filter(r=>bookGenresOf(r).includes(bookGenreFilter));
  if(m.id==="mountains" && mtnRegion) listBase = listBase.filter(r=>mtnRegionMatch(r, mtnRegion));
  if(m.id==="diary" && diaryTag) listBase = listBase.filter(r=>rowTags(r).includes(diaryTag));
  if(m.id==="diary" && diaryMood) listBase = listBase.filter(r=>String(r.mood||"")===diaryMood);
  let rows=filterRows(m, listBase, state.query);
  if(m.newestFirst && (!state.sort || state.sort==="default")){ rows=[...rows].reverse(); }   // 최신 입력이 위로
  if(m.dateSort && !((m.sorts||m.scopeSort) && state.sort && state.sort!=="default")){ rows=[...rows].sort((a,b)=>{ const ad=parseDate(a[m.dateSort]), bd=parseDate(b[m.dateSort]); return (bd?bd.getTime():-Infinity)-(ad?ad.getTime():-Infinity); }); }
  if((m.sorts||m.scopeSort) && state.sort && state.sort!=="default"){
    const asc=state.sortAsc, k=state.sort;
    const isNum=v=>/^\s*-?[\d.,]+\s*$/.test(String(v));   // 문자열 전체가 숫자일 때만 숫자정렬(날짜는 문자정렬)
    const _kf=(m.fields||[]).find(f=>f.k===k); const _isDate=_kf&&_kf.type==="date";
    rows=[...rows].sort((a,b)=>{ const av=a[k],bv=b[k];
      if(_isDate){ const ad=parseDate(av), bd=parseDate(bv); const an=ad?ad.getTime():-Infinity, bn=bd?bd.getTime():-Infinity; return asc?an-bn:bn-an; }
      if(isNum(av)&&isNum(bv)){ const an=parseFloat(av),bn=parseFloat(bv); return asc?an-bn:bn-an; }
      const as=String(av==null?"":av),bs=String(bv==null?"":bv); return asc?as.localeCompare(bs,"ko"):bs.localeCompare(as,"ko"); });
  }
  const _cnt=$("#count");

    const _sb=m.sorts.map(so=>{ const on=state.sort===so.k; return `<button class="sort-btn ${on?'on':''}" data-gs="${so.k}">${so.label}${on?(state.sortAsc?"↑":"↓"):(so.asc?"↑":"↓")}</button>`; }).join("");

  } else if(state.statFilter!=null && m.stats[state.statFilter]){   // 통계 필터 켜졌을 때: 무엇으로 걸렀는지 + 해제 버튼

  if(m.id==="subs") loadSubsCovers(m);

  ndApplySelectUI(m);
}

function lazyPosters(){   // 화면에 들어온 카드만 TMDB에서 포스터 로드(메모리 캐시)
  if(!CONFIG.TMDB_KEY) return;
  const io=new IntersectionObserver((ents,obs)=>{
    ents.forEach(async e=>{ if(!e.isIntersecting) return; const el=e.target; obs.unobserve(el);
      const q=el.dataset.title||el.dataset.orig; if(!q) return;
      const key=q+"|"+(el.dataset.year||"");
      if(posterCache[key]===undefined){
        posterCache[key]=null;
        try{ const u=`${CONFIG.TMDB_BASE}/search/movie?api_key=${CONFIG.TMDB_KEY}&language=ko-KR&query=${encodeURIComponent(q)}${el.dataset.year?`&year=${el.dataset.year}`:""}`;
          const d=await fetch(u).then(r=>r.json()); const hit=(d.results||[])[0];
          posterCache[key]=hit&&hit.poster_path?("https://image.tmdb.org/t/p/w185"+hit.poster_path):null;
        }catch(_){ posterCache[key]=null; }
      }
      if(posterCache[key]) el.innerHTML=`<img src="${posterCache[key]}" alt="" style="width:100%;height:100%;object-fit:cover">`;
    });
  },{rootMargin:"300px"});
  document.querySelectorAll(".thumb[data-poster]").forEach(el=>io.observe(el));
}

function todayStr(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

  if(m=x.match(/^(\d{4})[-.\/](\d{1,2})[-.\/](\d{1,2})/)) return new Date(+m[1],+m[2]-1,+m[3]);

  const d=new Date(x); return isNaN(d)?null:d; }
function inPeriod(d, period){ if(period==="all") return true; if(!d) return false; const now=new Date();
  if(period==="today") return d.toDateString()===now.toDateString();

  if(period==="week"){ const s=new Date(now); const off=(now.getDay()+6)%7; s.setDate(now.getDate()-off); s.setHours(0,0,0,0); return d>=s; }
  return true; }

function chartMonths(ids, ev){    // 최근 6개월 · 분야별 누적 막대

  });

function chartCalendar(ids, ev){  // 이번달 · 날짜별 히트맵(전 분야 합산)
  const now=new Date(), y=now.getFullYear(), mo=now.getMonth();
  const days=new Date(y,mo+1,0).getDate(), offset=new Date(y,mo,1).getDay();
  const perDay={}; ev.forEach(e=>{ if(e.t.getFullYear()===y&&e.t.getMonth()===mo){ const d=e.t.getDate(); perDay[d]=(perDay[d]||0)+1; } });
  const vals=Object.values(perDay), max=Math.max(1,...vals);
  const wd=["일","월","화","수","목","금","토"];
  let cells=wd.map(d=>`<div class="cal-h">${d}</div>`).join("");
  for(let i=0;i<offset;i++) cells+=`<div class="cal-c cal-e"></div>`;
  for(let d=1;d<=days;d++){ const v=perDay[d]||0, lvl=v?Math.min(4,Math.ceil(4*v/max)):0;
    cells+=`<div class="cal-c${lvl?' lvl'+lvl:''}" title="${y}-${mo+1}-${d} · ${v}건">${d}</div>`; }
  const total=vals.reduce((a,b)=>a+b,0);
  return `<div class="dash-note">${mo+1}월 · 총 ${total}건</div><div class="cal-grid">${cells}</div>`
    + `<div class="dash-legend" style="justify-content:flex-end;gap:4px"><span style="font-size:11px;color:var(--ink-soft);margin-right:2px">적음</span><i class="cal-key lvl1"></i><i class="cal-key lvl2"></i><i class="cal-key lvl3"></i><i class="cal-key lvl4"></i><span style="font-size:11px;color:var(--ink-soft);margin-left:2px">많음</span></div>`;
}
function chartTrend(ids, ev){     // 최근 10주 · 주별 합산 추이
  const now=new Date(), weeks=[], monday=new Date(now), off=(now.getDay()+6)%7;
  monday.setDate(now.getDate()-off); monday.setHours(0,0,0,0);
  for(let i=9;i>=0;i--){ const sd=new Date(monday); sd.setDate(monday.getDate()-7*i); weeks.push(sd); }
  const counts=weeks.map(()=>0);
  ev.forEach(e=>{ for(let i=weeks.length-1;i>=0;i--){ if(e.t>=weeks[i]){ counts[i]++; break; } } });
  const max=Math.max(1,...counts), n=weeks.length, W=320,H=150,padB=22,padT=14,padL=10,padR=10;
  const sx=(W-padL-padR)/(n-1);
  const pts=counts.map((v,i)=>[padL+sx*i,(H-padB)-(H-padB-padT)*(v/max)]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const area=line+` L ${pts[n-1][0].toFixed(1)} ${H-padB} L ${pts[0][0].toFixed(1)} ${H-padB} Z`;
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="#16a34a"><title>${counts[i]}건</title></circle>`).join("");
  let labs=""; weeks.forEach((sd,i)=>{ if(i%2===0) labs+=`<text x="${(padL+sx*i).toFixed(1)}" y="${H-7}" text-anchor="middle" font-size="9" fill="#888">${sd.getMonth()+1}/${sd.getDate()}</text>`; });
  const total=counts.reduce((a,b)=>a+b,0);
  return `<div class="dash-note">최근 10주 · 총 ${total}건</div><svg viewBox="0 0 ${W} ${H}" width="100%" style="display:block"><path d="${area}" fill="var(--accent-wash)" stroke="none"/><path d="${line}" fill="none" stroke="#16a34a" stroke-width="2"/>${dots}${labs}</svg>`;
}

/* ══════════════ 생리주기 (Period Tracker) ══════════════
   저장: localStorage nd.period {cycles:[{_id,start,end,flow,symptoms:[],mood,note}]}
   + 구글시트 '생리주기' 탭 동기화(기기간 공유). MBTI와 동일 패턴. */
var PD_TAB="생리주기", PD_HEAD=["_id","시작일","종료일","양","증상","기분","메모"];
var PD_SYMPTOMS=["복통","두통","요통","유방통","붓기","여드름","피로","식욕↑","불면","어지럼"];
var PD_MOODS=["평온","예민","우울","불안","의욕↑","눈물"];
var PD_FLOWS=["적음","보통","많음"];
var pdCalY=null, pdCalM=null, pdEditId=null, pdFormOpen=false;   /* ★v432 */

function _pdEsc(x){ return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function _pdSaved(){ try{ var raw=store.getItem("nd.period"); var o=raw?JSON.parse(raw):null; if(!o||!o.cycles) return {cycles:[]}; return o; }catch(e){ return {cycles:[]}; } }
function _pdWrite(o){ try{ store.setItem("nd.period", JSON.stringify(o)); }catch(e){} }
function pdParse(s){ if(!s) return null; var p=String(s).split(/[.\-\/]/).map(function(x){return parseInt(x,10);}); if(p.length<3||isNaN(p[0])||isNaN(p[1])||isNaN(p[2])) return null; return new Date(p[0], p[1]-1, p[2]); }
function pdFmt(d){ if(!d) return ""; return d.getFullYear()+"."+String(d.getMonth()+1).padStart(2,"0")+"."+String(d.getDate()).padStart(2,"0"); }
function pdFmtMD(d){ if(!d) return ""; return (d.getMonth()+1)+"."+String(d.getDate()).padStart(2,"0"); }
function pdToday(){ var d=new Date(); return new Date(d.getFullYear(), d.getMonth(), d.getDate()); }
function pdAdd(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function pdDiff(a,b){ return Math.round((b-a)/86400000); } /* b-a in days */
function pdSameDay(a,b){ return a&&b&&a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }

/* 기록을 시작일 오름차순 정렬해서 반환 */
function pdCycles(){ var o=_pdSaved(); var arr=(o.cycles||[]).map(function(c){ return c; }).filter(function(c){ return c&&c.start; });
  arr.sort(function(a,b){ var da=pdParse(a.start), db=pdParse(b.start); return (da?da.getTime():0)-(db?db.getTime():0); }); return arr; }

/* 통계 + 예측 */
/* ★v430: 평균 대신 중앙값. 평균은 한 번의 이상치(짧은 간격·긴 공백)에 통째로 끌려간다. */
function _pdMedian(a){ var b=a.slice().sort(function(x,y){return x-y;}), n=b.length;
  if(!n) return null; return n%2 ? b[(n-1)/2] : Math.round((b[n/2-1]+b[n/2])/2); }
function pdStats(){
  var cy=pdCycles(); var starts=cy.map(function(c){return pdParse(c.start);}).filter(Boolean);
  var st={count:cy.length, cycles:cy, avgCycle:28, avgPeriod:5, lastStart:null, next:null, ovul:null,
          fertS:null, fertE:null, dday:null, phase:"", inPeriod:false, periodDay:0,
          minCycle:null, maxCycle:null,
          /* ★v430 */ cycleKnown:false, periodKnown:false, gapsUsed:0, gapsDropped:[]};
  if(!starts.length) return st;
  st.lastStart=starts[starts.length-1];

  /* 주기 = 연속 시작일 간격. 최근 6개의 중앙값만 쓴다. */
  var all=[]; for(var i=1;i<starts.length;i++) all.push(pdDiff(starts[i-1],starts[i]));
  var ok=[], bad=[];
  all.forEach(function(g){ if(g>=15&&g<=60) ok.push(g); else if(g>0) bad.push(g); });
  st.gapsDropped=bad;                       /* ★버린 것은 화면에서 말해준다(§0-D) */
  ok=ok.slice(-6);
  if(ok.length){ st.avgCycle=_pdMedian(ok); st.cycleKnown=true; st.gapsUsed=ok.length;
    st.minCycle=Math.min.apply(null,ok); st.maxCycle=Math.max.apply(null,ok); }

  /* 기간 = 시작~종료. 최근 6개 평균 */
  var pl=[]; cy.forEach(function(c){ var a=pdParse(c.start), b=pdParse(c.end);
    if(a&&b){ var d=pdDiff(a,b)+1; if(d>=1&&d<=14) pl.push(d); } });
  pl=pl.slice(-6);
  if(pl.length){ var ps=0; pl.forEach(function(d){ps+=d;}); st.avgPeriod=Math.round(ps/pl.length); st.periodKnown=true; }

  var today=pdToday();
  /* 생리중인지 — 실제 종료일이 있으면 그것으로, 없으면 평균 기간으로 본다 */
  var lc=cy[cy.length-1], lastEnd=null;
  if(lc){ var le=pdParse(lc.end); lastEnd = le ? le : pdAdd(st.lastStart, st.avgPeriod-1); }
  if(lastEnd && pdDiff(st.lastStart,today)>=0 && pdDiff(today,lastEnd)>=0){
    st.inPeriod=true; st.periodDay=pdDiff(st.lastStart,today)+1; }

  /* ★★예측은 주기를 실제로 잰 뒤에만 한다.
     기본값 28일로 예정일·배란일·가임기를 그리면 전부 지어낸 숫자가 된다(§0-D). */
  if(st.cycleKnown){
    st.next=pdAdd(st.lastStart, st.avgCycle);
    var guard=0; while(pdDiff(today, st.next)< -1 && guard<24){ st.next=pdAdd(st.next, st.avgCycle); guard++; }
    st.ovul=pdAdd(st.next,-14); st.fertS=pdAdd(st.ovul,-5); st.fertE=pdAdd(st.ovul,1);
    st.dday=pdDiff(today, st.next);
    if(st.inPeriod) st.phase="생리 "+st.periodDay+"일차";
    else if(today>=st.fertS && today<=st.fertE) st.phase= pdSameDay(today,st.ovul)?"배란일":"가임기";
    else if(pdDiff(pdAdd(st.next,-5),today)>=0 && pdDiff(today,pdAdd(st.next,-1))>=0) st.phase="PMS 예상";   /* ★v443 */
    else if(today>st.ovul && today<st.next) st.phase="황체기";
    else st.phase="여포기";
  } else {
    st.phase = st.inPeriod ? ("생리 "+st.periodDay+"일차") : "기록 모으는 중";
  }
  return st;

/* 달력 */
function pdCalHTML(st){
  var y=pdCalY, m=pdCalM;
  var first=new Date(y,m,1); var startDow=first.getDay(); var dim=new Date(y,m+1,0).getDate();
  var today=pdToday();
  function inRecordedPeriod(d){ for(var i=0;i<st.cycles.length;i++){ var c=st.cycles[i]; var a=pdParse(c.start); if(!a) continue; var e=pdParse(c.end); if(!e) e=pdAdd(a, st.avgPeriod-1); if(pdDiff(a,d)>=0 && pdDiff(d,e)>=0) return true; } return false; }
  var _preds=[]; if(st.next){ for(var _k=0;_k<14;_k++){ var _ps=pdAdd(st.next, st.avgCycle*_k); var _ov=pdAdd(_ps,-14);
    /* ★v443: PMS = 예정일 5일 전 ~ 1일 전 */
    _preds.push({s:_ps, e:pdAdd(_ps, st.avgPeriod-1), ov:_ov, fs:pdAdd(_ov,-5), fe:pdAdd(_ov,1), ms:pdAdd(_ps,-5), me:pdAdd(_ps,-1)}); } }
  function inPredicted(d){ for(var j=0;j<_preds.length;j++){ if(pdDiff(_preds[j].s,d)>=0 && pdDiff(d,_preds[j].e)>=0) return true; } return false; }
  function isPredOvul(d){ for(var j=0;j<_preds.length;j++){ if(pdSameDay(d,_preds[j].ov)) return true; } return false; }
  function inFertile(d){ for(var j=0;j<_preds.length;j++){ if(pdDiff(_preds[j].fs,d)>=0 && pdDiff(d,_preds[j].fe)>=0) return true; } return false; }
  function inPms(d){ for(var j=0;j<_preds.length;j++){ if(pdDiff(_preds[j].ms,d)>=0 && pdDiff(d,_preds[j].me)>=0) return true; } return false; }
  var cells="";
  for(var i=0;i<startDow;i++) cells+='<div class="pdCell pdEmpty"></div>';
  for(var day=1;day<=dim;day++){
    var d=new Date(y,m,day); var cls="pdCell"; var mark="";
    if(inRecordedPeriod(d)) cls+=" pdPeriod";
    else if(inPredicted(d)) cls+=" pdPred";
    else if(isPredOvul(d)) cls+=" pdOvul";
    else if(inFertile(d)) cls+=" pdFert";
    else if(inPms(d)) cls+=" pdPms";
    if(pdSameDay(d,today)) cls+=" pdToday";
    cells+='<div class="'+cls+'"><span>'+day+'</span>'+mark+'</div>';
  }
  var dows=["일","월","화","수","목","금","토"].map(function(w){return '<div class="pdDow">'+w+'</div>';}).join("");
  return '<div class="pdCalWrap"><div class="pdCalHead"><button class="pdNav" id="pdCalPrev">‹</button><span class="pdCalTit">'+y+'년 '+(m+1)+'월</span><button class="pdNav" id="pdCalNext">›</button></div>'
    +'<div class="pdGrid">'+dows+cells+'</div>'
    +'<div class="pdLegend"><span><i class="pdLgP"></i>생리</span><span><i class="pdLgPr"></i>예상</span><span><i class="pdLgF"></i>가임기</span><span><i class="pdLgO"></i>배란</span><span><i class="pdLgM"></i>PMS 예상</span></div></div>';
}

/* ── 내 결산 (Wrapped) : 실시간 생성 + 이미지 저장 ───────────────── */
/* ★v422: '했다'의 표현이 카테고리마다 다르다(체크박스 true / 코드 "O" / 문자열 "TRUE").
   한 곳에서만 판정한다. 앞으로 새 카테고리가 늘어도 여기만 본다. */
function _ndDone(v){ return v===true||v==="O"||v==="TRUE"||v==="true"||v==="Y"||v===1||v==="1"; }
/* ★v422: 내 별점은 1~10점이다(별 반쪽 = 0.5 → 내부 10점 환산, starBarHTML과 같은 규칙).
   '좋게 봤다'의 기준선은 8점. 4점은 10점 만점에서 낙제였다. */
var ND_LOVE = 8;
function _ndRate(r){
  var v = r && r.rating;
  if(v==null || v==="") return null;
  v = parseFloat(v); if(isNaN(v)) return null;
  if(v<=5 && v%1!==0) v = v*2;          /* 4.5 같은 옛 5점 표기 → 9 */
  return v;
}
function _wTruthy(v){ return v===true||v==="TRUE"||v==="true"||v==="O"||v==="Y"||v==="예"||v===1||v==="1"; }
function _wEsc(x){ return String(x==null?"":x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function _wNum(v){ if(v==null||v==="") return null; var n=parseFloat(v); return isNaN(n)?null:n; }
function _wDone(id,r){
  if(_wNum(r.rating)!=null) return true;
  if(_wTruthy(r.watched)||_wTruthy(r.climbed)) return true;
  var st=String(r.status||""); if(st==="읽음"||st==="다녀옴"||st==="관람"||st==="완료"||st==="봤음"||st==="방문") return true;
  if(id==="running") return true;
  return false;
}
function wrapStats(ids, data){
  var S={total:0,experienced:0,rated:0,ratingSum:0,best:null,cats:[]};
  ids.forEach(function(id){
    var rows=data[id]||[]; if(!rows.length) return;
    var m=MANIFESTS[id]; var exp=0;
    rows.forEach(function(r){
      var rt=_wNum(r.rating);
      if(rt!=null){ S.rated++; S.ratingSum+=rt; if(!S.best||rt>S.best.rating) S.best={rating:rt,title:(r.title||r.name||""),cat:m.title}; }
      if(_wDone(id,r)) exp++;
    });
    S.total+=rows.length; S.experienced+=exp;
    S.cats.push({id:id,title:m.title,icon:m.icon,n:rows.length,exp:exp});
  });
  S.cats.sort(function(a,b){return b.n-a.n;});
  S.avg=S.rated?Math.round(S.ratingSum/S.rated*10)/10:null;
  S.expPct=S.total?Math.round(S.experienced/S.total*100):0;
  // 영화
  if((data.movies||[]).length){ var mv=data.movies; var w=mv.filter(function(r){return _wTruthy(r.watched);});
    var cc={},dc={},sum=0,cnt=0,best=null;
    w.forEach(function(r){ var c=String(r.country||"").trim(); if(c) cc[c]=(cc[c]||0)+1; var d=String(r.director||"").trim(); if(d) dc[d]=(dc[d]||0)+1; var rt=_wNum(r.rating); if(rt!=null){sum+=rt;cnt++; if(!best||rt>best.rating)best={rating:rt,title:r.title};} });
    var top=function(o){return Object.keys(o).map(function(k){return [k,o[k]];}).sort(function(a,b){return b[1]-a[1];});};
    S.movies={watched:w.length,avg:cnt?Math.round(sum/cnt*10)/10:null,country:top(cc),director:top(dc).slice(0,4),best:best};
  }
  // 도서
  if((data.books||[]).length){ var bk=data.books; var read=bk.filter(function(r){return String(r.status||"")==="읽음";});
    var g={}; bk.forEach(function(r){ String(r.genre||"").split(/[,\s]+/).forEach(function(x){ x=x.trim(); if(x) g[x]=(g[x]||0)+1; }); });
    S.books={read:read.length,total:bk.length,genres:Object.keys(g).map(function(k){return [k,g[k]];}).sort(function(a,b){return b[1]-a[1];}).slice(0,6),
      readTitles:read.map(function(r){return r.title;}).filter(Boolean)};
  }
  // 등산
  if((data.mountains||[]).length){ var mt=data.mountains; S.mountains={total:mt.length,climbed:mt.filter(function(r){return _wTruthy(r.climbed);}).map(function(r){return r.title;}).filter(Boolean)}; }
  // 러닝
  if((data.running||[]).length){ var rn=data.running; var dsum=0; rn.forEach(function(r){ var dd=_wNum(r.dist); if(dd)dsum+=dd; });
    var last=rn[rn.length-1]||{}; S.running={count:rn.length,dist:Math.round(dsum*10)/10,memo:String(last.memo||"").trim(),place:String(last.place||"").trim()}; }
  return S;
}

/* ★v420: 내가 매긴 평점만 본다. TMDB 평점(남의 점수)은 취향의 근거가 아니다. */
function _ndMyRate(id, r){
  /* ★v422: 영화의 내 평점 키도 rating이다("평점"이 아니다). tmdbRating은 남의 점수라 안 본다. */
  return _ndRate(r);
}
/* ★v420: 취향은 '많이'가 아니라 '내가 좋다고 한 것'에서 나온다.
   표본이 3개 미만이면 아무 말도 하지 않는다(억지 분석 금지). */
function _ndTasteFacts(d){
  var out=[], data=(d&&d.data)||{};
  var rows=function(id){ return data[id]||[]; };
  var top=function(arr,key,min){ var c={};
    arr.forEach(function(r){ String(r[key]==null?"":r[key]).split(/[,\/|]+/).forEach(function(v){ v=String(v).trim(); if(v) c[v]=(c[v]||0)+1; }); });
    var ks=Object.keys(c).sort(function(a,b){ return c[b]-c[a]; });
    return (ks.length && c[ks[0]]>=(min||2)) ? {k:ks[0], n:c[ks[0]]} : null;
  };

  /* 영화 — 내가 ★8 이상 준 것만 (내 별점은 10점 만점이다) */
  var mv=rows("movies").filter(function(r){ return _ndDone(r.watched); });
  var loved=mv.filter(function(r){ var v=_ndMyRate("movies",r); return v!=null && v>=ND_LOVE; });
  if(loved.length>=3){
    var dir=top(loved,"director",2), ctry=top(loved,"country",2);
    var bits=[];
    if(dir) bits.push('별점을 높게 준 작품 중 <b>'+_wEsc(dir.k)+'</b> 감독이 '+dir.n+'편');
    /* ★v422: '미국이 절반 이상'은 취향이 아니라 시장 점유율이다(영석 지적). 미국은 말하지 않는다. */
    if(ctry && !/미국|USA|United States/i.test(ctry.k) && ctry.n>=Math.ceil(loved.length*0.5)) bits.push('<b>'+_wEsc(ctry.k)+'</b> 작품이 절반 이상');
    /* ★v422: 고르는 눈 — 본 것 대비 높게 준 비율. 이건 목록 출처가 아니라 이 사람의 판단이다. */
    if(mv.length>=8){ var _pct=Math.round(loved.length/mv.length*100);
      if(_pct>=60) bits.push('본 '+mv.length+'편 중 '+loved.length+'편에 <b>★'+ND_LOVE+' 이상</b> — 고르는 데 거의 실패하지 않는다');
      else if(_pct<=25) bits.push('본 '+mv.length+'편 중 마음에 든 건 '+loved.length+'편 — <b>기준이 높다</b>');
    }
    var yrs=loved.map(function(r){ return parseInt(r.year,10); }).filter(function(y){ return y>1900 && y<2100; });
    if(yrs.length>=3){ var avg=Math.round(yrs.reduce(function(a,b){return a+b;},0)/yrs.length);
      var nowY=new Date().getFullYear();
      if(nowY-avg>=12) bits.push('아끼는 영화의 평균 개봉연도가 <b>'+avg+'년</b> — 요즘 것보다 옛것을 고른다');
      else if(nowY-avg<=5) bits.push('아끼는 영화가 대체로 <b>최근작</b>('+avg+'년 무렵)');
    }
    if(bits.length) out.push({h:"🎬 영화에서 드러나는 것", body:bits.join('<br>'), n:loved.length});
  }

  /* 책 — 읽은 것 중 내가 ★8 이상 준 것 */
  var bk=rows("books").filter(function(r){ return r.status==="읽음"; });
  var bl=bk.filter(function(r){ var v=_ndMyRate("books",r); return v!=null && v>=ND_LOVE; });
  if(bl.length>=3){
    var g=top(bl,"genre",2), au=top(bl,"author",2), bb=[];
    if(g) bb.push('마음에 남은 책의 <b>'+_wEsc(g.k)+'</b>가 '+g.n+'권');
    if(au) bb.push('<b>'+_wEsc(au.k)+'</b>를 '+au.n+'권');
    if(bb.length) out.push({h:"📖 책에서 드러나는 것", body:bb.join('<br>'), n:bl.length});
  }

  /* 실제로 간 곳 — 계획이 아니라 발자국 */
  var mt=rows("mountains").filter(function(r){ return r.climbed===true||r.climbed==="TRUE"||r.climbed==="true"; });

  }
  return out;
}

function _buildLifeContextV2(ids,data){
try{
var norm=function(s){return String(s==null?"":s).replace(/\s+/g," ").trim();};
var cut=function(s,n){s=norm(s);return s.length>n?s.slice(0,n)+"…":s;};
var has=function(id){return (data&&data[id]&&data[id].length)?data[id]:null;};
var rate=function(r){try{var v=(typeof _ndRate==="function")?_ndRate(r):parseFloat(r.rating);return (v==null||isNaN(v))?null:v;}catch(e){return null;}};
var rev=function(r){return norm(r.review||r.content||r.memo||"");};
var okRev=function(t){return t&&t.length>=15&&!/[ㄱ-ㅎㅏ-ㅣ]\s*$/.test(t);};
var L=[];
var loved=[];
[["movies","영화"],["books","책"],["travel","여행"],["food","맛집"]].forEach(function(p){
var a=has(p[0]); if(!a)return;
a.forEach(function(r){var rv=rev(r),rt=rate(r); if(okRev(rv)){loved.push({cat:p[1],title:norm(r.title),rate:rt,rv:cut(rv,70),score:(rt||3)*2+Math.min(rv.length/20,5)});}});
});
loved.sort(function(a,b){return b.score-a.score;});
if(loved.length) L.push("[C·마음이 실린 것 — 직접 평점 매기고 감상을 남긴 것. 무엇에 마음이 닿는지의 핵심. 작품 내용을 옮기지 말고 무엇에 마음이 움직였는지 방향만]\n"+loved.slice(0,6).map(function(x){return "· "+x.cat+" 「"+x.title+"」"+(x.rate!=null?(" ★"+x.rate):"")+" — "+x.rv;}).join("\n"));
var run=has("running");
if(run){var pl={}; run.forEach(function(r){var p=norm(r.place);if(p)pl[p]=(pl[p]||0)+1;});
var plA=Object.keys(pl).sort(function(a,b){return pl[b]-pl[a];}).slice(0,3);
var mm=run.filter(function(r){return norm(r.memo);}).sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""));}).slice(0,3).map(function(r){return cut(r.memo,24);});
L.push("[A·최근 자주 하는 실행] 러닝"+(plA.length?(" — 주로 "+plA.join(", ")):"")+(mm.length?(". 그날 남긴 말: "+mm.join(" / ")):""));}
var dia=has("diary");
if(dia){var ds=dia.slice().sort(function(a,b){return String(b.date||"").localeCompare(String(a.date||""));});
var pk=ds.filter(function(r){return norm(r.content);}).slice(0,8).map(function(r){return "· "+(r.date||"")+(norm(r.mood)?(" ["+norm(r.mood)+"]"):"")+" "+cut(r.content,80);});
if(pk.length) L.push("[B·일기 — 직접 쓴 글. 감정의 유일한 출처. 원문 인용 나열 금지, 온도로만]\n"+pk.join("\n"));
var mo=ds.slice(0,6).map(function(r){return norm(r.mood);}).filter(Boolean);
if(mo.length) L.push("[F·최근 기분 흐름(최신에서 과거로)] "+mo.join(" → "));}
var nd=[]; if(dia) dia.forEach(function(r){var n=norm(r.nddaily);if(n)nd.push(n);});
if(nd.length) L.push("[A·배경(자동기록, 팩트로만 감정 아님. 몸통 금지)] 최근 접한 것: "+cut(nd.join(" / "),140));
if(!L.length){return _buildLifeContext(ids,data);}
return L.join("\n\n");
}catch(e){try{return _buildLifeContext(ids,data);}catch(_e){return "";}}
}

/* ★v419: 저장되는 모든 이미지 아래에 내도감 마크를 찍는다.

function _ndStamp(canvas){
  try{
    var w=canvas.width, s=w/1080;                 // 1080px 기준으로 비율 맞춤
    var bar=Math.round(96*s);
    var out=document.createElement("canvas"); out.width=w; out.height=canvas.height+bar;
    var g=out.getContext("2d");
    g.fillStyle="#0d0a1f"; g.fillRect(0,0,out.width,out.height);
    g.drawImage(canvas,0,0);
    var cy=canvas.height+bar/2;
    /* 왼쪽 막대 3개 = 내도감 로고 */
    var bx=Math.round(46*s), bw=Math.round(9*s), gap=Math.round(7*s), bh=Math.round(30*s);
    var cols=["#c9bfae","#c9bfae","#e0483f"], hs=[0.62,0.82,1];
    for(var i=0;i<3;i++){ g.fillStyle=cols[i]; var h=Math.round(bh*hs[i]);
      g.fillRect(bx+i*(bw+gap), Math.round(cy+bh/2-h), bw, h); }
    g.fillStyle="#f6eddf"; g.font="700 "+Math.round(30*s)+"px Pretendard, 'Noto Sans KR', sans-serif";
    g.textBaseline="middle"; g.fillText("내도감", bx+3*(bw+gap)+Math.round(14*s), cy);
    g.fillStyle="rgba(246,237,223,.55)"; g.font="500 "+Math.round(23*s)+"px Pretendard, 'Noto Sans KR', sans-serif";
    g.textAlign="right"; g.fillText("app.naedogam.com", w-Math.round(46*s), cy);
    return out;
  }catch(e){ return canvas; }
}
/* ★v419: 저장 대신 '공유'까지. 폰이 지원하면 시스템 공유창(인스타·카톡…)이 뜬다. */
function _ndShareCanvas(canvas, filename, btn, t0, shareText){
  var stamped=_ndStamp(canvas);
  var done=function(){ try{ _ndSavedToast(btn,t0); }catch(e){} };
  var fallback=function(blob){
    try{
      var url=URL.createObjectURL(blob); var a=document.createElement("a"); a.href=url; a.download=filename;
      document.body.appendChild(a); a.click(); a.remove(); setTimeout(function(){ URL.revokeObjectURL(url); },2000);
    }catch(e){ var a2=document.createElement("a"); a2.href=stamped.toDataURL("image/png"); a2.download=filename; a2.click(); }
    done();
  };
  try{
    stamped.toBlob(function(blob){
      if(!blob){ done(); return; }
      try{
        var file=new File([blob], filename, {type:"image/png"});
        if(navigator.canShare && navigator.canShare({files:[file]})){
          navigator.share({ files:[file], text:(shareText||"내도감 · app.naedogam.com") })
            .then(function(){ try{ ndGA("card_share",{via:"native"}); }catch(e){} done(); })
            .catch(function(err){ if(err && err.name==="AbortError"){ if(btn){ btn.disabled=false; btn.textContent=t0; } return; } fallback(blob); });
          return;
        }
      }catch(e){}
      fallback(blob);
    },"image/png");
  }catch(e){ fallback(null); }
}

function parseCSV(text){
  text=String(text||"").replace(/^\uFEFF/,"").replace(/\r\n/g,"\n").replace(/\r/g,"\n");
  const rows=[]; let cur=[],val="",q=false;
  for(let i=0;i<text.length;i++){ const ch=text[i];
    if(q){ if(ch==='"'){ if(text[i+1]==='"'){ val+='"'; i++; } else q=false; } else val+=ch; }
    else if(ch==='"') q=true;
    else if(ch===',') { cur.push(val); val=""; }
    else if(ch==='\n'){ cur.push(val); rows.push(cur); cur=[]; val=""; }
    else val+=ch;
  }
  cur.push(val); rows.push(cur);
  return rows.filter(r=>r.some(c=>String(c).trim()!==""));
}

function wireReorder(box, onCommit){
  let drag=null;
  box.querySelectorAll(".ord-handle").forEach(h=>{
    h.addEventListener("pointerdown", e=>{ e.preventDefault(); drag=h.closest(".ord-row"); if(!drag) return; drag.classList.add("dragging"); try{ box.setPointerCapture(e.pointerId); }catch(_){}} );   // 캡처는 안 움직이는 box에 → 행 재배치 중 lostpointercapture로 끊기지 않음(여러 칸 연속 이동)
  });
  const move=e=>{ if(!drag) return; e.preventDefault(); const y=e.clientY;
    const after=[...box.querySelectorAll(".ord-row:not(.dragging)")].find(sib=>{ const r=sib.getBoundingClientRect(); return y < r.top + r.height/2; });
    if(after){ if(after!==drag.nextSibling) box.insertBefore(drag, after); }
    else { if(drag!==box.lastElementChild) box.appendChild(drag); } };
  const end=()=>{ if(!drag) return; drag.classList.remove("dragging"); drag=null; onCommit([...box.querySelectorAll(".ord-row")].map(r=>r.dataset.id)); };
  box.addEventListener("pointermove", move);
  box.addEventListener("pointerup", end);
  box.addEventListener("pointercancel", end);
  box.addEventListener("lostpointercapture", end);
}

async function freeTabName(name, fields){
  const expected = JSON.stringify(["_id"].concat((fields||[]).map(f=>f.label)));
  async function conflict(t){ try{ const rows=await sheetSrc().readTab(t); if(!rows.length) return false; return JSON.stringify(Object.keys(rows[0]))!==expected; }catch(e){ return false; } }
  let tab=name, n=2;
  while(await conflict(tab)){ tab=name+" ("+n+")"; n++; if(n>50) break; }
  return tab;
}

/* ── 6. 부트: 저장된 Client ID 있으면 구글, 없으면 데모 ── */
/* ── 책 추가: 구글 북스에서 제목 검색 → 저자·연도·표지 자동 채움 → 목록에 추가 ── */
async function _fetchT(url, ms){
  ms = ms || 8000;
  if(typeof AbortController==="undefined") return fetch(url);
  var ctl=new AbortController(), timedOut=false;
  var t=setTimeout(function(){ timedOut=true; try{ctl.abort();}catch(e){} }, ms);
  try{ return await fetch(url,{signal:ctl.signal}); }
  catch(e){ if(timedOut) throw new Error("네트워크가 느려요. 잠시 후 다시 시도해 주세요."); throw e; }
  finally{ clearTimeout(t); }
}
async function searchBooks(q){
  if(!q || !q.trim()) return [];
  var key = CONFIG.GOOGLE_BOOKS_KEY ? ("&key="+CONFIG.GOOGLE_BOOKS_KEY) : "";
  const url="https://www.googleapis.com/books/v1/volumes?maxResults=6&country=KR&q="+encodeURIComponent(q.trim())+key;
  let res=await _fetchT(url);
  if(res.status===429){                       // 너무 자주 불러 잠깐 막힘 → 1.2초 쉬고 한 번 더
    await new Promise(r=>setTimeout(r,1200));
    res=await _fetchT(url);
  }
  if(res.status===429) throw new Error("검색이 잠깐 제한됐어요. 몇 초 뒤 다시 해보거나, 설정 안내대로 '책 검색 키'를 넣으면 해결됩니다.");
  if(!res.ok) throw new Error("HTTP "+res.status);
  const d=await res.json();
  return (d.items||[]).map(it=>{ const v=it.volumeInfo||{};
    return { title:v.title||"", author:(v.authors||[]).join(", "),
      year:parseInt(String(v.publishedDate||"").slice(0,4),10)||null,
      cover:String(v.imageLinks&&v.imageLinks.thumbnail||"").replace(/^http:/,"https:"),
      genre:(v.categories||[]) }; });
}

async function _tmdbSearchOnce(q){
  const url=`${CONFIG.TMDB_BASE}/search/movie?api_key=${CONFIG.TMDB_KEY}&language=ko-KR&query=${encodeURIComponent(q)}`;
  let res=await _fetchT(url);
  if(res.status===429){ await new Promise(r=>setTimeout(r,1000)); res=await _fetchT(url); }
  if(res.status===429) throw new Error("검색이 잠깐 제한됐어요. 몇 초 뒤 다시 해보세요.");
  if(!res.ok) throw new Error("HTTP "+res.status);
  const d=await res.json();
  return (d.results||[]).map(m=>({
    id:m.id, orig:m.original_title||m.title||"", kor:m.title||m.original_title||"",
    year:(m.release_date||"").slice(0,4), rating:m.vote_average?Math.round(m.vote_average*10)/10:"",
    poster:m.poster_path?("https://image.tmdb.org/t/p/w185"+m.poster_path):"" }));
}
/* ★v428: TMDB는 붙여 쓴 한글을 못 찾는다(실측: "벤자민버튼" 0건 / "벤자민" 3건에 정답 포함).
   0건이면 앞쪽만 남겨 다시 묻고, 띄어쓰기·문장부호를 뗀 제목이 가까운 순으로 올린다. */
function _ndTitleNorm(t){ return String(t||"").replace(/[^0-9A-Za-z가-힣]/g,"").toLowerCase(); }
async function searchMovies(q){
  if(!q || q.trim().length<2) return [];
  const raw=q.trim();
  let out=await _tmdbSearchOnce(raw);
  if(!out.length){
    const flat=_ndTitleNorm(raw);
    if(/[가-힣]/.test(flat) && flat.length>=4){
      const tries=[flat.slice(0,3)]; if(flat.length>=6) tries.push(flat.slice(0,4));
      let pool=[];
      for(let i=0;i<tries.length;i++){ try{ pool=pool.concat(await _tmdbSearchOnce(tries[i])); }catch(e){} }
      const seen={}; pool=pool.filter(m=>{ if(seen[m.id]) return false; seen[m.id]=1; return true; });
      const sc=m=>{ const a=_ndTitleNorm(m.kor), b=_ndTitleNorm(m.orig);
        if(a===flat||b===flat) return 3;
        if((a&&a.indexOf(flat)>=0)||(b&&b.indexOf(flat)>=0)) return 2;
        if(a&&a.length>=2&&flat.indexOf(a)>=0) return 1;
        return 0; };
      pool.sort((x,y)=>sc(y)-sc(x));
      out=pool;
    }
  }
  return out.slice(0,6);
}
async function fetchMovieExtra(id){   // 감독·배우·국적 (두 번째 호출)
  try{

      fetch(`${CONFIG.TMDB_BASE}/movie/${id}/credits?api_key=${CONFIG.TMDB_KEY}&language=ko-KR`).then(r=>r.json())
    ]);
    return { director:(cred.crew||[]).filter(c=>c.job==="Director").map(c=>c.name).join(", "),
             actors:(cred.cast||[]).slice(0,4).map(c=>c.name).join(", "),
             country:(det.production_countries||[]).map(c=>c.name).join(", ") };
  }catch(e){ return {director:"",actors:"",country:""}; }
}

/* ★v425: 홈 카드의 사진 줄 — 옆으로 밀기.
   카드 전체가 <button>이라 그냥 두면 미는 동작이 '분야 열기' 클릭으로 새어 나간다.
   그래서 민 직후의 클릭 한 번만 삼킨다. */
function _ndStripDragBoot(){
  var SEL='.ndhome .food-photos, .ndhome .covers';
  var pick=function(el){ return (el && el.closest) ? el.closest(SEL) : null; };
  document.addEventListener('pointerdown', function(e){
    var s=pick(e.target); if(!s) return;
    if(s.scrollWidth <= s.clientWidth+4) return;      /* 밀 게 없으면 그냥 둔다 */
    var x0=e.clientX, sl=s.scrollLeft, pid=e.pointerId, mouse=(e.pointerType==='mouse'), moved=false;
    var move=function(ev){
      if(ev.pointerId!==pid) return;
      var dx=ev.clientX-x0;
      if(!moved && Math.abs(dx)>6){ moved=true; if(mouse) s.classList.add('ndDragging'); }
      if(moved && mouse){ s.scrollLeft = sl-dx; ev.preventDefault(); }
    };
    var up=function(ev){
      window.removeEventListener('pointermove',move,true);
      window.removeEventListener('pointerup',up,true);
      window.removeEventListener('pointercancel',up,true);
      s.classList.remove('ndDragging');
      /* ★v428: 손가락으로 밀면 크롬이 스크롤을 넘겨받으면서 pointercancel을 던지고 pointermove가 끊긴다.
         그래서 moved가 false로 남아 클릭이 그대로 새어 나갔다(영석 신고). 취소 = 스크롤 시작으로 본다. */
      if(ev && ev.type==='pointercancel') moved=true;
      if(!moved && Math.abs(s.scrollLeft-sl)>2) moved=true;
      if(moved) s.__ndDragT=Date.now();
    };
    window.addEventListener('pointermove',move,true);
    window.addEventListener('pointerup',up,true);
    window.addEventListener('pointercancel',up,true);
  }, true);
  /* ★v428: 가장 확실한 신호는 '줄이 실제로 스크롤됐는가'다. scroll은 버블링을 안 하므로 캡처로 받는다. */
  document.addEventListener('scroll', function(e){
    var s=e.target; if(!s || !s.matches) return;
    try{ if(s.matches(SEL)) s.__ndDragT=Date.now(); }catch(err){}
  }, true);
  document.addEventListener('click', function(e){
    var s=pick(e.target); if(!s) return;
    /* ★v429: 영석 요청 그대로 — "롤링되는 이미지 만질 때는 그냥 그 상태로 있어야 한다."
       v428은 '민 직후인가'를 시간으로 판정했는데 안드로이드에서 여전히 새어 나갔다.
       밀 수 있는 줄이면 시간 판정 없이 **항상** 삼킨다. 분야는 카드 글자 영역을 눌러서 연다. */
    if(s.scrollWidth > s.clientWidth+4){ e.stopPropagation(); e.preventDefault(); return; }
    if(s.__ndDragT && (Date.now()-s.__ndDragT)<600){ e.stopPropagation(); e.preventDefault(); }
  }, true);
}

<script>

     반면 메뉴를 한 번 만진 뒤에는 확인창이 떴다 — 영석이 본 두 경우가 정확히 이 차이다.
     그래서 첫 조작이 들어온 순간, 그 조작에 얹어 가드를 한 번 더 심는다. */
  var _gestArmed=false;
  function armOnGesture(){
    if(_gestArmed) return; _gestArmed=true;
    try{ pushBase(); }catch(e){}
  }
  document.addEventListener('pointerdown', armOnGesture, {capture:true, passive:true});
  document.addEventListener('touchstart', armOnGesture, {capture:true, passive:true});
  document.addEventListener('keydown', armOnGesture, true);
  window.__ndReArm=function(){ _gestArmed=false; };   /* 가드가 소모되면 다음 조작에 다시 심는다 */
  /* ★v430: 화면이 다시 보일 때(백그라운드 복귀·로그인 후 돌아옴) 가드가 남아 있는지 확인 */
  document.addEventListener('visibilitychange', function(){ if(!document.hidden) setTimeout(armBase,0); });
  window.addEventListener('pageshow', function(){ setTimeout(armBase,0); });
  var mo=new MutationObserver(function(){ sync(); });
  try{ mo.observe(document.documentElement,{subtree:true,attributes:true,childList:true,attributeFilter:['open','style','class']}); }catch(e){}
  setInterval(sync, 500);
  document.addEventListener('DOMContentLoaded', sync);
  setTimeout(sync, 300);
})();
</script>

<script>
/* v359β 자동 최신화: 서비스워커 없는 standalone(홈화면 아이콘)에서
   옛 HTML 스냅샷을 물고 있는 문제 해결. 로드 후 라이브 mhver를 캐시 무시로
   읽어와 내 버전과 다르면 자동 새로고침.
   ★로그인 안전: OAuth 토큰은 location.hash로 오므로 해시 있으면 절대 스킵. */
(function(){
  try{
    if(window.__ndVerChecked) return; window.__ndVerChecked=true;
    if(location.hash) return;                        /* OAuth 콜백(#access_token) 진행중 -> 건드리지 않음 */
    if(location.search.indexOf("ndu=")>=0) return;   /* 방금 자동갱신으로 들어옴 -> 무한 리로드 방지 */
    var el=document.querySelector(".mhver");
    var CUR=el?String(el.textContent||"").trim():"";
    if(!/^v\d/.test(CUR)) return;
    setTimeout(function(){
      try{
        if(location.hash) return;
        fetch(location.pathname+"?ndv="+Date.now(), {cache:"no-store"})
          .then(function(r){ return r.ok?r.text():null; })
          .then(function(html){
            if(!html) return;
            var m=html.match(/class="mhver[^"]*"[^>]*>\s*(v\d[^<]*)/);
            if(!m) return;
            var live=String(m[1]).trim();
            if(!live || live===CUR) return;
            if(location.hash) return;
            var t=document.createElement("div");
            t.textContent="새 버전("+live+") 적용 중…";
            t.style.cssText="position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);z-index:99999;background:#e0483f;color:#fff;font-size:13px;font-weight:800;padding:9px 15px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.35)";
            document.body.appendChild(t);
            setTimeout(function(){ location.replace(location.pathname+"?ndu="+encodeURIComponent(live)); }, 900);
          })
          .catch(function(){});
      }catch(e){}
    }, 2500);
  }catch(e){}
})();
</script>
<script>
/* v361: 서비스워커 등록 (network-first). 비상 해제: 앱을 ?nosw=1 로 열기. */
(function(){
  if(!('serviceWorker' in navigator)) return;
  window.addEventListener('load', function(){
    try{
      if(location.search.indexOf('nosw')>=0){
        navigator.serviceWorker.getRegistrations().then(function(rs){ rs.forEach(function(r){ r.unregister(); }); }).catch(function(){});
        if(window.caches) caches.keys().then(function(ks){ ks.forEach(function(k){ caches.delete(k); }); }).catch(function(){});
        return;
      }
      navigator.serviceWorker.register('sw.js').catch(function(){});
    }catch(e){}
  });
})();
</script>
